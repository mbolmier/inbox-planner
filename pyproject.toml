[project]
name = "inbox-planner"
version = "0.1.0"
description = "Read-only inbox to planner: LLM triage and extraction, deterministic energy-aware scheduling, privacy first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "icalendar>=7.3.2",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "sqlmodel>=0.0.50",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inbox-planner = "inbox_planner:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.14.0",
]
gmail = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "hypothesis>=6.170.17",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, modern syntax, likely bugs, simplifications
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers"]
