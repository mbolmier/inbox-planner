# Local safety net. Install once with: uv run pre-commit install
# gitleaks comes from Homebrew (brew install gitleaks); ruff comes from uv.lock,
# so there is a single pinned version of each tool.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: gitleaks-history
        name: gitleaks (full history, before push)
        entry: gitleaks git --redact --no-banner -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]
