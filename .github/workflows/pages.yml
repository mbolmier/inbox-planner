name: Demo on GitHub Pages

# A read-only copy of the demo (fictional mailbox, recorded answers), rebuilt on
# every push to main. No model is called, no account or key is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build only reads the code; only the deploy job may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the read-only demo
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Render every page from the demo mailbox and the recorded answers
        run: uv run inbox-planner export-site --output site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
