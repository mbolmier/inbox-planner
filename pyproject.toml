[project]
name = "inbox-planner"
version = "0.1.0"
description = "Read-only inbox to planner: LLM triage and extraction, deterministic energy-aware scheduling, privacy first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
inbox-planner = "inbox_planner:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, modern syntax, likely bugs, simplifications
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
