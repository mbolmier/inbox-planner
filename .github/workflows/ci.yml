name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: by default the workflow can only read the code.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Evaluation replayed from the recorded answers (no model call, no account)
        run: uv run inbox-planner eval --output docs/evaluation.md > /dev/null
      - name: The published evaluation report is up to date
        run: git diff --exit-code docs/evaluation.md

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t inbox-planner:ci .
      - name: The demo answers from inside the container
        run: |
          docker run -d --name demo -p 127.0.0.1:8000:8000 inbox-planner:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q "Lundi 26 octobre"
          curl -fsS http://127.0.0.1:8000/export.ics | head -n 1 | grep -q "BEGIN:VCALENDAR"
          test "$(docker exec demo id -u)" = "10001"  # not root
      - name: Container logs (on failure)
        if: failure()
        run: docker logs demo || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lets the action list the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1" # same version as the local hooks
          GITLEAKS_ENABLE_COMMENTS: false
